# Quality gate for every PR and every push to `next` / `main`.
# Required status checks (branch protection): `verify` and `e2e` (shown as "ci / verify", "ci / e2e").
# See docs/plan/03-deployment-flow.md §4 and docs/DEPLOYMENT.md.
name: ci

on:
  pull_request:
    branches: [next, main]
  push:
    branches: [next, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://castiarena.github.io
      - run: node scripts/verify-export.mjs
        env:
          VERIFY_STRICT: '0' # agent 3.1 flips this to '1' once sitemap.xml/robots.txt exist
      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out
          include-hidden-files: true # keep out/.nojekyll so e2e serves the exact export
          retention-days: 3

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_SKIP_BUILD: '1' # playwright webServer serves ./out only
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
